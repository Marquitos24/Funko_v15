services:
  funkos:
    image: funkos
    build:
      context: ./Funkos
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Sobrescribimos para que apunte a los nombres de los contenedores en Docker
      - ConnectionStrings__DefaultConnection=Host=posgresql;Port=5432;Database=FunkosDb;Username=admin;Password=admin123
      - MongoDbSettings__ConnectionString=mongodb://admin:admin123@mongo:27017/ProvDb?authSource=admin
      - Redis__ConnectionString=redis:6379,password=miPassword123
    depends_on:
      posgresql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    
  posgresql:
    image: postgres:16
    ports:
      - "5432:5432"
    container_name: postgres_funkos
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: FunkosDb
    volumes:
          - postgre-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready -U admin -d FunkosDb"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    container_name: mongo-proveedores
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
  postgre-data:
    
